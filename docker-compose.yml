# docker-compose.yml — A throwaway local OpenSearch for hands-on exploration of
# dsh-searchops. This is OPTIONAL: `npm run demo` (scripts/demo.mjs) needs no
# Docker at all. Use this only to point the plugin at a real cluster.
#
#   docker compose up -d
#   node examples/seed-demo-logs.mjs          # insert the payment-api demo logs
#   # then configure the plugin with examples/config.local.json and ask the agent
#   # to run searchops_status / _logs / _aggregate / _investigate against "local".
#
#   docker compose down -v                     # remove the cluster and its data
#
# The security plugin is disabled so http://localhost:9200 works with auth "none"
# (loopback is allowed without allowInsecureHttp). NEVER reuse these settings for
# anything reachable beyond your machine.

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: dsh-searchops-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
